<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      width: 250px;
      padding: 10px;
    }
    h3 {
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 95%;
      padding: 5px;
    }
    button {
      width: 100%;
      padding: 8px;
      cursor: pointer;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>2FA Automation Config</h3>
  <div class="form-group">
    <label for="userId">Unique ID:</label>
    <input type="text" id="userId" placeholder="Enter a random string">
  </div>
  <button id="save">Save</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
